<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Okeat Lens logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD5C9"/><stop offset=".55" stop-color="#FBD5E0"/><stop offset="1" stop-color="#DAD5FF"/>
    </linearGradient>
    <radialGradient id="plate" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F0FF"/>
    </radialGradient>
    <style>
      .spin{transform-origin:80px 80px;animation:spin 14s linear infinite}
      .pulse{transform-origin:122px 38px;animation:pulse 2.4s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
      @media (prefers-reduced-motion:reduce){.spin,.pulse{animation:none}}
    </style>
  </defs>
  <rect x="6" y="6" width="148" height="148" rx="40" fill="url(#bg)"/>
  <circle cx="80" cy="82" r="50" fill="url(#plate)" stroke="#5548C8" stroke-width="5"/>
  <circle cx="80" cy="82" r="38" fill="none" stroke="#DAD5FF" stroke-width="3"/>
  <g class="spin">
    <g transform="translate(0 2)">
      <path d="M80 54 L96 70 L80 80 Z" fill="#FFD5C9"/>
      <path d="M104 74 L104 96 L80 80 Z" fill="#D9F3E7"/>
      <path d="M96 106 L74 106 L80 80 Z" fill="#FFF1C9"/>
      <path d="M62 102 L56 80 L80 80 Z" fill="#FBD5E0"/>
      <path d="M58 66 L74 52 L80 80 Z" fill="#DAD5FF"/>
    </g>
  </g>
  <circle cx="80" cy="82" r="9" fill="#5548C8"/>
  <circle cx="77" cy="79" r="3" fill="#FFFFFF"/>
  <g class="pulse"><path d="M122 26 L125 35 L134 38 L125 41 L122 50 L119 41 L110 38 L119 35 Z" fill="#FFFFFF" stroke="#A8483A" stroke-width="2" stroke-linejoin="round"/></g>
</svg>
