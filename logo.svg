<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Okeat Lens logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0D6"/><stop offset=".5" stop-color="#F6DDF0"/><stop offset="1" stop-color="#DCD7FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="plate" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1EEFF"/>
    </radialGradient>
    <radialGradient id="lens" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#8B7CF6"/><stop offset=".6" stop-color="#5548C8"/><stop offset="1" stop-color="#2C2668"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5548C8" flood-opacity=".22"/>
    </filter>
    <style>
      .ring{transform-origin:80px 80px;animation:spin 18s linear infinite}
      .leaf{transform-origin:118px 44px;animation:sway 3.2s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes sway{50%{transform:rotate(-10deg)}}
      @media (prefers-reduced-motion:reduce){.ring,.leaf{animation:none}}
    </style>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="42" fill="url(#bg)"/>
  <rect x="4" y="4" width="152" height="152" rx="42" fill="url(#shine)"/>
  <g class="ring" fill="none" stroke-width="11" stroke-linecap="round">
    <circle cx="80" cy="80" r="47" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="13"/>
    <circle cx="80" cy="80" r="47" pathLength="100" stroke="#F5A3C0" stroke-dasharray="20 80" stroke-dashoffset="0" transform="rotate(-90 80 80)"/>
    <circle cx="80" cy="80" r="47" pathLength="100" stroke="#F0CF7A" stroke-dasharray="34 66" stroke-dashoffset="-27" transform="rotate(-90 80 80)"/>
    <circle cx="80" cy="80" r="47" pathLength="100" stroke="#8FE0BE" stroke-dasharray="25 75" stroke-dashoffset="-68" transform="rotate(-90 80 80)"/>
  </g>
  <circle cx="80" cy="80" r="33" fill="url(#plate)" filter="url(#sh)"/>
  <circle cx="80" cy="80" r="26" fill="none" stroke="#E4DEFF" stroke-width="2"/>
  <circle cx="80" cy="80" r="16" fill="url(#lens)"/>
  <circle cx="80" cy="80" r="16" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="74.5" cy="74.5" r="4.5" fill="#FFFFFF" opacity=".9"/>
  <circle cx="85.5" cy="86" r="2" fill="#FFFFFF" opacity=".55"/>
  <g class="leaf">
    <path d="M118 44 C 118 30 128 22 142 22 C 142 36 133 44 118 44 Z" fill="#8FE0BE" stroke="#1F7350" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M118 44 C 124 37 130 31 137 27" fill="none" stroke="#1F7350" stroke-width="2" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
